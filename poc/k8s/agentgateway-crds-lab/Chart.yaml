apiVersion: v2
name: agentgateway-crds-lab
description: Umbrella chart pinning agentgateway's CRDs for this POC
version: 0.1.0

# We don't vendor the agentgateway-crds chart itself -- only this pin and our
# own values.yaml override it. `helm dependency update` fetches the actual
# chart (as a .tgz under charts/, gitignored -- regenerable from this file)
# rather than us carrying a stale copy of agentgateway's source in the repo.
dependencies:
  - name: agentgateway-crds
    # Bumped from v1.4.1 (temporary, deliberate): v1.4.1 predates a fix for
    # InferencePool + AgentgatewayBackend custom-provider routing (agentgateway
    # PR closing issue #2976, merged 2026-08-12) -- no stable release has it
    # yet, only this beta. Revisit pinning back to a stable tag once one ships
    # with the fix.
    version: v1.5.0-beta.1
    repository: oci://cr.agentgateway.dev/charts
