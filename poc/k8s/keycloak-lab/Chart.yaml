apiVersion: v2
name: keycloak-lab
description: Umbrella chart pinning Keycloak (Control Plane B, human signup only) for this POC
version: 0.1.0

# Same pattern as agentgateway-crds-lab/agentgateway-lab -- pin + override only, no
# vendored source. codecentric/keycloakx chosen over bitnami/keycloak: it uses the
# official quay.io/keycloak/keycloak image directly (pinned, freely pullable) rather
# than Bitnami's own rebuilt images, which moved most tags behind a paid tier in 2025.
dependencies:
  - name: keycloakx
    version: 7.3.1
    repository: https://codecentric.github.io/helm-charts
