apiVersion: v1
data:
  relay.py: |
    """Content-Type-fixing relay for agentgateway's data-plane /metrics endpoint.

    agentgateway (v1.5.0-beta.1, and still on main as of 2026-09) always encodes
    its /metrics body with prometheus_client's OpenMetrics text encoder -- the
    only text encoder that Rust crate has -- but hardcodes the response header to
    Content-Type: text/plain;charset=utf-8 whenever protobuf isn't requested.
    OpenMetrics-only constructs like the "info" metric type (used by
    agentgateway_build_info) aren't legal under that header's implied format, so
    Prometheus rejects the ENTIRE scrape as unparseable. Confirmed by reading
    crates/agentgateway/src/management/metrics_server.rs directly, and by
    empirically testing PodMonitor.spec.fallbackScrapeProtocol/scrapeProtocols,
    neither of which helps -- both only apply when Content-Type is missing or
    unrecognized, not when it's valid-but-semantically-wrong, as it is here.

    This relay doesn't touch the body at all -- it fetches agentgateway's
    /metrics verbatim and re-serves the exact same bytes under the correct
    Content-Type, which Prometheus's OpenMetrics parser (unlike its classic
    parser) already fully supports.
    """

    import os
    import urllib.request
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

    UPSTREAM = os.environ.get("UPSTREAM_METRICS_URL", "http://agentgateway-metrics-upstream:15020/metrics")
    PORT = int(os.environ.get("PORT", "9114"))
    CONTENT_TYPE = "application/openmetrics-text;version=1.0.0;charset=utf-8"


    class Handler(BaseHTTPRequestHandler):
        def log_message(self, fmt, *args):
            print(f"{self.address_string()} - {fmt % args}")

        def do_GET(self):
            if self.path != "/metrics":
                self.send_response(404)
                self.end_headers()
                return
            try:
                with urllib.request.urlopen(UPSTREAM, timeout=5) as resp:
                    body = resp.read()
            except Exception as exc:
                self.send_response(502)
                self.end_headers()
                self.wfile.write(f"upstream fetch failed: {exc}".encode())
                return
            self.send_response(200)
            self.send_header("Content-Type", CONTENT_TYPE)
            self.send_header("Content-Length", str(len(body)))
            self.end_headers()
            self.wfile.write(body)


    if __name__ == "__main__":
        server = ThreadingHTTPServer(("0.0.0.0", PORT), Handler)
        print(f"agentgateway metrics relay listening on :{PORT}, upstream={UPSTREAM}")
        server.serve_forever()
