# Two separate single-replica Deployments (not one Deployment x2 replicas) so
# each pod can be given distinct initial load values -- makes EPP's pick
# provable from the start, before any /control calls are made. Both carry
# app=vllm-mock-pool, matching the InferencePool's selector; pod-a/pod-b are
# extra labels only, not part of that selector.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-mock-a
  labels:
    app: vllm-mock-pool
    pod: a
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vllm-mock-pool
      pod: a
  template:
    metadata:
      labels:
        app: vllm-mock-pool
        pod: a
    spec:
      containers:
        - name: mock-server
          image: python:3.12-slim
          command: ["python3", "/app/mock_server.py"]
          ports:
            - containerPort: 8000
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: INIT_NUM_REQUESTS_WAITING
              value: "0"
            - name: INIT_KV_CACHE_USAGE_PERC
              value: "0.05"
          volumeMounts:
            - name: code
              mountPath: /app
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 1
            periodSeconds: 5
      volumes:
        - name: code
          configMap:
            name: vllm-mock-server-code
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-mock-b
  labels:
    app: vllm-mock-pool
    pod: b
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vllm-mock-pool
      pod: b
  template:
    metadata:
      labels:
        app: vllm-mock-pool
        pod: b
    spec:
      containers:
        - name: mock-server
          image: python:3.12-slim
          command: ["python3", "/app/mock_server.py"]
          ports:
            - containerPort: 8000
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: INIT_NUM_REQUESTS_WAITING
              value: "50"
            - name: INIT_KV_CACHE_USAGE_PERC
              value: "0.9"
          volumeMounts:
            - name: code
              mountPath: /app
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 1
            periodSeconds: 5
      volumes:
        - name: code
          configMap:
            name: vllm-mock-server-code
